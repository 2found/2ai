name: Check
on:
  push:
    branches-ignore: [main]
    tags-ignore: ['v*']
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/release-plan.test.mjs scripts/release-assets.test.mjs
      - run: go mod download
      - run: go test -race -p 2 ./...
      - run: go vet ./...
      - run: go run ./examples/scripted
